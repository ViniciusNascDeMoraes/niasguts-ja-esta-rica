<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="O contador oficial para descobrir se niasguts já está rica."
    >
    <meta name="theme-color" content="#ff4f91">
    <title>niasguts já está rica?</title>

    <style>
      :root {
        --ink: #17131d;
        --paper: #fff9fb;
        --blush: #ffd5e5;
        --pink: #ff4f91;
        --pink-dark: #d91f64;
        --red: #ef3340;
        --gold: #ffd666;
        --lavender: #c7b5ff;
        --shadow: rgba(23, 19, 29, 0.22);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-width: 20rem;
        color-scheme: light;
      }

      body {
        min-height: 100svh;
        margin: 0;
        overflow-x: hidden;
        color: var(--ink);
        font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 14% 18%, rgba(255, 255, 255, 0.95) 0 0.45rem, transparent 0.5rem),
          radial-gradient(circle at 88% 78%, rgba(255, 255, 255, 0.8) 0 0.3rem, transparent 0.35rem),
          linear-gradient(135deg, #ffd8e6 0%, #fff0bd 48%, #f1ddff 100%);
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -2;
        background-image:
          radial-gradient(circle, rgba(23, 19, 29, 0.16) 0 0.08rem, transparent 0.09rem),
          linear-gradient(45deg, transparent 47%, rgba(255, 79, 145, 0.1) 48% 52%, transparent 53%);
        background-size: 1.15rem 1.15rem, 4rem 4rem;
        content: "";
        opacity: 0.55;
      }

      body::after {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: radial-gradient(circle at center, transparent 35%, rgba(255, 79, 145, 0.16) 100%);
        content: "";
        pointer-events: none;
      }

      .page {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: clamp(1rem, 4vw, 3rem);
      }

      .card {
        position: relative;
        width: min(100%, 61rem);
        padding: clamp(2.25rem, 7vw, 5rem) clamp(1rem, 5vw, 4rem) clamp(1.5rem, 5vw, 3.5rem);
        overflow: hidden;
        text-align: center;
        background:
          linear-gradient(var(--paper), var(--paper)) padding-box,
          linear-gradient(115deg, var(--ink), var(--pink), var(--red), var(--ink)) border-box;
        border: 0.3rem solid transparent;
        border-radius: clamp(1.5rem, 4vw, 3rem);
        box-shadow:
          0.7rem 0.8rem 0 var(--ink),
          0 1.8rem 4rem var(--shadow);
        isolation: isolate;
      }

      .card::before {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 1.15rem;
        background:
          linear-gradient(135deg, transparent 25%, rgba(255, 255, 255, 0.34) 25% 50%, transparent 50% 75%, rgba(255, 255, 255, 0.34) 75%) 0 0 / 1rem 1rem,
          var(--ink);
        content: "";
      }

      .card::after {
        position: absolute;
        right: -3rem;
        bottom: -3rem;
        z-index: -1;
        width: 10rem;
        height: 10rem;
        border: 1.5rem solid rgba(255, 79, 145, 0.12);
        border-radius: 50%;
        content: "";
      }

      .sparkle {
        position: absolute;
        color: var(--pink);
        font-size: clamp(1.5rem, 4vw, 2.75rem);
        line-height: 1;
        user-select: none;
        animation: twinkle 2.2s ease-in-out infinite;
      }

      .sparkle-left {
        top: 2.2rem;
        left: clamp(1.25rem, 5vw, 4rem);
        transform: rotate(-12deg);
      }

      .sparkle-right {
        top: clamp(4rem, 9vw, 6rem);
        right: clamp(1.25rem, 5vw, 4rem);
        color: var(--red);
        animation-delay: -1.1s;
      }

      .eyebrow {
        display: inline-block;
        margin: 0 0 0.75rem;
        padding: 0.35rem 0.85rem;
        color: var(--paper);
        font-size: clamp(0.68rem, 2vw, 0.82rem);
        font-weight: 900;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        background: var(--ink);
        border-radius: 999px;
        transform: rotate(-1deg);
      }

      h1 {
        max-width: 17ch;
        margin: 0 auto;
        font-size: clamp(2.15rem, 7vw, 5rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
        text-wrap: balance;
      }

      .verdict {
        position: relative;
        display: inline-grid;
        margin: clamp(1.25rem, 4vw, 2.25rem) 0 clamp(1.5rem, 5vw, 3rem);
        place-items: center;
        transform: rotate(-2deg);
        animation: float 3.4s ease-in-out infinite;
      }

      .verdict::before {
        position: absolute;
        z-index: -1;
        width: 112%;
        height: 86%;
        background: var(--gold);
        border: 0.22rem solid var(--ink);
        border-radius: 48% 52% 45% 55% / 52% 44% 56% 48%;
        box-shadow: 0.35rem 0.4rem 0 var(--ink);
        content: "";
      }

      .answer {
        margin: 0;
        padding: 0.05em 0.32em 0.12em;
        color: var(--red);
        font-size: clamp(5rem, 20vw, 11rem);
        font-weight: 1000;
        line-height: 0.9;
        letter-spacing: -0.08em;
        text-shadow:
          0.035em 0.035em 0 var(--paper),
          0.065em 0.065em 0 var(--ink);
      }

      .counter-heading {
        margin: 0 0 1rem;
        color: var(--pink-dark);
        font-size: clamp(0.9rem, 2.4vw, 1.1rem);
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .counter {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: clamp(0.45rem, 1.5vw, 0.9rem);
        width: 100%;
      }

      .counter-part {
        min-width: 0;
        padding: clamp(0.7rem, 2.5vw, 1.15rem) 0.3rem;
        background: #ffffff;
        border: 0.16rem solid var(--ink);
        border-radius: 1rem;
        box-shadow: 0.22rem 0.25rem 0 var(--ink);
      }

      .counter-part:nth-child(2n) {
        background: var(--blush);
        transform: translateY(0.35rem);
      }

      .counter-part:nth-child(3) {
        background: #fff0ae;
      }

      .counter-part:nth-child(4) {
        background: #ece6ff;
      }

      .counter-value {
        display: block;
        overflow: hidden;
        font-size: clamp(1.45rem, 5vw, 2.75rem);
        font-variant-numeric: tabular-nums;
        font-weight: 1000;
        letter-spacing: -0.05em;
        line-height: 1;
        text-overflow: clip;
      }

      .counter-unit {
        display: block;
        margin-top: 0.45rem;
        font-size: clamp(0.58rem, 1.8vw, 0.78rem);
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .since {
        margin: clamp(1.35rem, 4vw, 2.25rem) 0 0;
        font-size: clamp(0.78rem, 2.2vw, 1rem);
        font-weight: 700;
      }

      .heart {
        color: var(--pink);
        font-size: 1.15em;
      }

      @keyframes float {
        0%,
        100% {
          transform: rotate(-2deg) translateY(0);
        }

        50% {
          transform: rotate(-1deg) translateY(-0.35rem);
        }
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.45;
          scale: 0.85;
        }

        50% {
          opacity: 1;
          scale: 1.12;
        }
      }

      @media (max-width: 34rem) {
        .card {
          box-shadow:
            0.4rem 0.45rem 0 var(--ink),
            0 1.2rem 2.5rem var(--shadow);
        }

        .counter {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .counter-part:last-child {
          grid-column: 1 / -1;
          width: calc(50% - 0.25rem);
          justify-self: center;
        }

        .sparkle-right {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <section class="card" aria-labelledby="question">
        <span class="sparkle sparkle-left" aria-hidden="true">✦</span>
        <span class="sparkle sparkle-right" aria-hidden="true">♡</span>

        <p class="eyebrow">status financeiro em tempo real</p>
        <h1 id="question">niasguts já está rica?</h1>

        <div class="verdict">
          <p class="answer" aria-label="Não">NÃO</p>
        </div>

        <p class="counter-heading">tempo oficialmente não rica</p>
        <div
          class="counter"
          id="age-counter"
          role="timer"
          aria-live="off"
          aria-label="Carregando idade"
        >
          <div class="counter-part">
            <strong class="counter-value" id="years">--</strong>
            <span class="counter-unit">anos</span>
          </div>
          <div class="counter-part">
            <strong class="counter-value" id="days">---</strong>
            <span class="counter-unit">dias</span>
          </div>
          <div class="counter-part">
            <strong class="counter-value" id="hours">--</strong>
            <span class="counter-unit">horas</span>
          </div>
          <div class="counter-part">
            <strong class="counter-value" id="minutes">--</strong>
            <span class="counter-unit">minutos</span>
          </div>
          <div class="counter-part">
            <strong class="counter-value" id="seconds">--</strong>
            <span class="counter-unit">segundos</span>
          </div>
        </div>

        <p class="since">
          desde 04 de outubro de 2000, 00:00 · São Paulo
          <span class="heart" aria-hidden="true">♡</span>
        </p>
      </section>
    </main>

    <script>
      "use strict";

      const BIRTH_YEAR = 2000;
      const BIRTH_MONTH = 10;
      const BIRTH_DAY = 4;
      const MILLISECONDS_PER_SECOND = 1000;
      const SECONDS_PER_MINUTE = 60;
      const MINUTES_PER_HOUR = 60;
      const HOURS_PER_DAY = 24;
      const MILLISECONDS_PER_DAY =
        MILLISECONDS_PER_SECOND * SECONDS_PER_MINUTE * MINUTES_PER_HOUR * HOURS_PER_DAY;
      const SAO_PAULO_TIME_ZONE = "America/Sao_Paulo";
      const saoPauloFormatter = new Intl.DateTimeFormat("en-CA", {
        timeZone: SAO_PAULO_TIME_ZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23",
      });
      const counter = document.querySelector("#age-counter");
      const counterValues = {
        years: document.querySelector("#years"),
        days: document.querySelector("#days"),
        hours: document.querySelector("#hours"),
        minutes: document.querySelector("#minutes"),
        seconds: document.querySelector("#seconds"),
      };

      function getSaoPauloParts(date) {
        // Read an instant as calendar fields in Sao Paulo.
        const fields = {};

        for (const part of saoPauloFormatter.formatToParts(date)) {
          if (part.type !== "literal") {
            fields[part.type] = Number(part.value);
          }
        }

        return fields;
      }

      function getSaoPauloMidnight(year, month, day) {
        // Convert a Sao Paulo calendar midnight into an exact instant.
        const targetAsUtc = Date.UTC(year, month - 1, day);
        let instant = targetAsUtc;
        const offsetCorrectionPasses = 3;

        for (let pass = 0; pass < offsetCorrectionPasses; pass += 1) {
          const fields = getSaoPauloParts(new Date(instant));
          const displayedAsUtc = Date.UTC(
            fields.year,
            fields.month - 1,
            fields.day,
            fields.hour,
            fields.minute,
            fields.second,
          );
          instant -= displayedAsUtc - targetAsUtc;
        }

        return new Date(instant);
      }

      const birthInstant = getSaoPauloMidnight(BIRTH_YEAR, BIRTH_MONTH, BIRTH_DAY);

      function updateCounter() {
        // Show the completed years and elapsed time since the latest birthday.
        const now = new Date();

        if (now < birthInstant) {
          for (const value of Object.values(counterValues)) {
            value.textContent = "0";
          }

          counter.setAttribute("aria-label", "A data atual é anterior ao nascimento");
          return;
        }

        let latestBirthdayYear = getSaoPauloParts(now).year;
        let latestBirthday = getSaoPauloMidnight(
          latestBirthdayYear,
          BIRTH_MONTH,
          BIRTH_DAY,
        );

        if (now < latestBirthday) {
          latestBirthdayYear -= 1;
          latestBirthday = getSaoPauloMidnight(
            latestBirthdayYear,
            BIRTH_MONTH,
            BIRTH_DAY,
          );
        }

        let remainingMilliseconds = now - latestBirthday;
        const years = latestBirthdayYear - BIRTH_YEAR;
        const days = Math.floor(remainingMilliseconds / MILLISECONDS_PER_DAY);
        remainingMilliseconds %= MILLISECONDS_PER_DAY;

        const hours = Math.floor(
          remainingMilliseconds /
            (MILLISECONDS_PER_SECOND * SECONDS_PER_MINUTE * MINUTES_PER_HOUR),
        );
        remainingMilliseconds %=
          MILLISECONDS_PER_SECOND * SECONDS_PER_MINUTE * MINUTES_PER_HOUR;

        const minutes = Math.floor(
          remainingMilliseconds / (MILLISECONDS_PER_SECOND * SECONDS_PER_MINUTE),
        );
        const seconds = Math.floor(
          (remainingMilliseconds % (MILLISECONDS_PER_SECOND * SECONDS_PER_MINUTE)) /
            MILLISECONDS_PER_SECOND,
        );

        counterValues.years.textContent = String(years).padStart(2, "0");
        counterValues.days.textContent = String(days).padStart(3, "0");
        counterValues.hours.textContent = String(hours).padStart(2, "0");
        counterValues.minutes.textContent = String(minutes).padStart(2, "0");
        counterValues.seconds.textContent = String(seconds).padStart(2, "0");
        counter.setAttribute(
          "aria-label",
          `${years} anos, ${days} dias, ${hours} horas, ${minutes} minutos e ${seconds} segundos`,
        );
      }

      function scheduleNextUpdate() {
        // Align every refresh with the next real clock second.
        const delay = MILLISECONDS_PER_SECOND - (Date.now() % MILLISECONDS_PER_SECOND);

        window.setTimeout(() => {
          // Refresh from the current clock before scheduling the next update.
          updateCounter();
          scheduleNextUpdate();
        }, delay);
      }

      updateCounter();
      scheduleNextUpdate();
    </script>
  </body>
</html>
